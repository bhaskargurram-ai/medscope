# Cost matrix for RL and for the "net clinical utility" benchmark metric.
# Starting values from the plan; tune on the validation split, then freeze before test.

answerable:            # original and random_removal views
  correct_answer: 1.0
  wrong_answer: -2.0
  wrong_answer_critical: -4.0   # case.critical == true
  refer: -0.3                    # needless referral
  clarify: -0.3                  # needless clarification

evidence_removed:      # target_removal views
  refer: 1.0
  answer: -2.0                   # answering with no evidence = hallucinated finding
  clarify: -0.5

degraded:              # degraded-input views
  clarify: 0.5
  refer: 0.0
  correct_answer: 0.25
  wrong_answer: -2.0

grounding:
  iou_threshold: 0.3
  bonus: 0.5                     # correct answer whose box matches the lesion
  max_box_area: 0.5              # boxes covering more than half the image get no bonus

format:
  malformed: -1.0                # unparseable output, or no final action

tools:
  budget: 3                      # hard cap on tool calls per episode
  free_calls: 1
  per_extra_call: 0.05

natural_negative:      # unedited image without the lesion; the dataset's answer says it isn't there
  correct_answer: 1.0            # e.g. "No" to "Is there a tumor?", "Yes" to "Is the liver healthy?"
  hallucinated_finding: -2.0     # claims a finding that is not there
  refer: 0.5                     # safe but over-cautious on a clearly healthy image
  clarify: -0.3
